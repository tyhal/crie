# yaml-language-server: $schema=../../../res/schema/lang.json
languages:
  python:
    match: ['\.py$']
    fmt:
      type: cli
      exec:
        bin: black
        start: ["--quiet"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-pip"
      tag_crie_version: true
    chk:
      exec:
        bin: pylint
        batch: true
      type: cli
      img: "ghcr.io/tyhal/crie-dep-pip"
      tag_crie_version: true
  proto:
    match: ['\.proto$']
    fmt:
      exec:
        bin: protolint
        batch: true
      type: cli
      img: "ghcr.io/tyhal/crie-dep-go"
      tag_crie_version: true
    chk:
      exec:
        bin: protolint
        batch: true
      type: cli
      img: "ghcr.io/tyhal/crie-dep-go"
      tag_crie_version: true
  bash:
    match: ['\.bash$']
    fmt:
      type: shfmt
      language: bash
    chk:
      type: cli
      exec:
        bin: shellcheck
        # SCRIPTDIR follows sources relative to each script, so no chdir is needed to batch
        start: ["-x", "--source-path=SCRIPTDIR", "--shell=bash", "-Calways"]
        batch: true
        batch_start: ["--format=gcc"]
      img: "docker.io/koalaman/shellcheck-alpine:stable"
  sh:
    match: ['\.sh$', '/script/[^.]*$', '^script/[^.]*$']
    fmt:
      type: shfmt
      language: posix
    chk:
      type: cli
      exec:
        bin: shellcheck
        # SCRIPTDIR follows sources relative to each script, so no chdir is needed to batch
        start: ["-x", "--source-path=SCRIPTDIR", "--shell=sh", "-Calways"]
        batch: true
        batch_start: ["--format=gcc"]
      img: "docker.io/koalaman/shellcheck-alpine:stable"
  docker:
    match: ['(?i).*(Contain|Docker)file.*']
    chk:
      type: cli
      exec:
        bin: hadolint
        start: ["--ignore", "DL3007", "--ignore", "DL3018", "--ignore", "DL3016", "--ignore", "DL4006"]
        batch: true
      img: "docker.io/hadolint/hadolint:latest-alpine"
  yml:
    match: ['\.ya?ml$']
    chk:
      exec:
        bin: yamllint
        batch: true
        # only findings that fail a file, so a failed batch only names the files to rerun
        batch_start: ["--format", "parsable", "--no-warnings"]
      type: cli
      img: "ghcr.io/tyhal/crie-dep-pip"
      tag_crie_version: true
    fmt:
      type: cli
      exec:
        bin: yamlfmt
        batch: true
      img: "ghcr.io/google/yamlfmt:latest"
  terraform:
    match: ['\.tf$']
    fmt:
      type: cli
      exec:
        bin: terraform
        start: ["fmt"]
      img: "docker.io/hashicorp/terraform:1.17.1"
    chk:
      type: cli
      exec:
        bin: tflint
        start: ["--filter"]
        chdir: true
      img: "ghcr.io/terraform-linters/tflint:v0.65.0"
  typescript:
    match: [".tsx$", ".ts$"]
    fmt:
      type: cli
      exec:
        bin: npx
        start: ["prettier", "--write"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-npm"
      tag_crie_version: true
  javascript:
    match: ['\.js$', '\.jsx$']
    fmt:
      type: cli
      exec:
        bin: standard
        start: ["--fix"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-npm"
      tag_crie_version: true
    chk:
      type: cli
      exec:
        bin: standard
        batch: true
      img: "ghcr.io/tyhal/crie-dep-npm"
      tag_crie_version: true
  golang:
    match: ['\.go$']
    fmt:
      type: cli
      exec:
        bin: gofmt
        start: ["-l", "-w"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-go"
      tag_crie_version: true
    chk:
      type: cli
      exec:
        bin: revive
        start: ["-config", "/etc/revive/revive.toml", "-set_exit_status"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-go"
      tag_crie_version: true
  markdown:
    match: ['\.md$']
    fmt:
      type: cli
      exec:
        bin: remark
        start: ["--use", "remark-preset-lint-recommended"]
        end: ["-o"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-npm"
      tag_crie_version: true
    chk:
      type: cli
      exec:
        bin: vale
        batch: true
        # only findings that fail a file, so a failed batch only names the files to rerun
        batch_start: ["--output=line", "--minAlertLevel=error"]
      img: "ghcr.io/tyhal/crie-dep-apk"
      tag_crie_version: true
  asciidoctor:
    match: ['\.adoc$']
    chk:
      type: cli
      exec:
        bin: vale
        batch: true
        # only findings that fail a file, so a failed batch only names the files to rerun
        batch_start: ["--output=line", "--minAlertLevel=error"]
      img: "ghcr.io/tyhal/crie-dep-apk"
      tag_crie_version: true
  json:
    match: ['\.json$', '\.JSON$']
    fmt:
      type: cli
      exec:
        bin: jsonlint
        start: ["-i", "-s", "-c", "-q"]
      img: "ghcr.io/tyhal/crie-dep-npm"
      tag_crie_version: true
    chk:
      type: cli
      exec:
        bin: jsonlint
        start: ["-q"]
      img: "ghcr.io/tyhal/crie-dep-npm"
      tag_crie_version: true
  cpp:
    match: ['\.cc$', '\.cpp$']
    fmt:
      type: cli
      exec:
        bin: clang-format
        start: ["-style=file", "-i"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-apk"
      tag_crie_version: true
    chk:
      type: cli
      exec:
        bin: cppcheck
        start: ["--enable=all", "--language=c++", "--suppress=operatorEqRetRefThis", "--suppress=operatorEq", "--suppress=noExplicitConstructor", "--suppress=unRegexedSuppression", "--suppress=missingInclude", "--suppress=unusedFunction", "--suppress=noConstructor", "--suppress=unmatchedSuppression", "--suppress=missingIncludeSystem", "--inline-suppr", "--error-exitcode=1"]
        batch: true
        batch_start: ["--template=gcc"]
      img: "ghcr.io/tyhal/crie-dep-apk"
      tag_crie_version: true
  cppheaders:
    match: ['\.h$', '\.hpp$']
    fmt:
      type: cli
      exec:
        bin: clang-format
        start: ["-style=file", "-i"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-apk"
      tag_crie_version: true
  c:
    match: ['\.c$']
    fmt:
      type: cli
      exec:
        bin: clang-format
        start: ["-style=file", "-i"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-apk"
      tag_crie_version: true
    chk:
      type: cli
      exec:
        bin: cppcheck
        start: ["--enable=all", "--language=c", "--suppress=unRegexedSuppression", "--suppress=missingInclude", "--suppress=unusedFunction", "--suppress=unmatchedSuppression", "--suppress=missingIncludeSystem", "--inline-suppr", "--error-exitcode=1"]
        batch: true
        batch_start: ["--template=gcc"]
      img: "ghcr.io/tyhal/crie-dep-apk"
      tag_crie_version: true
  cmake:
    match: ['CMakeLists.txt$', '\.cmake$']
    chk:
      type: cli
      exec:
        bin: cmakelint
        start: ["--config=/etc/.config/cmakelintrc"]
        batch: true
      img: "ghcr.io/tyhal/crie-dep-pip"
      tag_crie_version: true
